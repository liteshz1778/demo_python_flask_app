deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    bucketNames:
      chunks: dummy
      ruler: dummy
      admin: dummy

  storage_config:
    filesystem:
      directory: /tmp/loki

  common:
    path_prefix: /tmp/loki

singleBinary:
  replicas: 1
  persistence:
    enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
