```
<!-- Insert -->
<div class="card mb-4">
    <h3>Insert User</h3>
    <form id="insertForm" class="d-flex gap-2 flex-wrap justify-content-center">
        <input type="text" id="name" class="form-control w-25" placeholder="Name" required>
        <input type="email" id="email" class="form-control w-25" placeholder="Email" required>
        <button type="button" class="btn btn-custom" onclick="addUser()">Add</button>
    </form>
</div>

<!-- Table -->
<div class="card">
    <h3>Users</h3>
    <table class="table text-white text-center">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
		<th>Actions</th>
            </tr>
        </thead>
        <tbody id="dataTable"></tbody>
    </table>
</div>
```

</div>

<script>
function addUser() {
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;

    if (!name || !email) {
        alert("Please fill all fields");
        return;
    }

    fetch('/add_user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        document.getElementById('insertForm').reset();
        loadData();
    })
    .catch(err => console.error(err));
}

function editUser(id, name, email) {
    const newName = prompt("Enter new name", name);
    const newEmail = prompt("Enter new email", email);

    if (!newName || !newEmail) return;

    fetch(`/update_user/${id}`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            name: newName,
            email: newEmail
        })
    })
    .then(res => res.text())
    .then(data => {
        alert(data);
        loadData();
    });
}

function deleteUser(id) {
    if (!confirm("Delete this user?")) return;

    fetch(`/delete_user/${id}`, {
        method: 'DELETE'
    })
    .then(res => res.text())
    .then(data => {
        alert(data);
        loadData();
    });
}

function loadData() {
    const dataTable = document.getElementById('dataTable');
    dataTable.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';

    fetch('/users')
    .then(response => response.json())
    .then(data => {
        let rows = '';

        data.forEach(record => {
            rows += `
            <tr>
                <td>${record.id}</td>
                <td>${record.name}</td>
                <td>${record.email}</td>
                <td>
			<button type="button" class="btn btn-warning btn-sm me-2"
			    onclick="editUser(${record.id}, \`${record.name}\`, \`${record.email}\`)">
			    Edit
			</button>

			<button type="button" class="btn btn-danger btn-sm"
			    onclick="deleteUser(${record.id})">
			    Delete
			</button>
                </td>
            </tr>
            `;
        });

        dataTable.innerHTML = rows;
    })
    .catch(err => {
        dataTable.innerHTML = '<tr><td colspan="4">Error loading data</td></tr>';
        console.error(err);
    });
}

window.onload = loadData;
</script>

</body>
