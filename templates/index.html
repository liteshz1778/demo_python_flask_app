```
<!-- Insert -->
<div class="card mb-4">
    <h3>Insert User</h3>
    <form id="insertForm" class="d-flex gap-2 flex-wrap justify-content-center">
        <input type="text" id="name" class="form-control w-25" placeholder="Name" required>
        <input type="email" id="email" class="form-control w-25" placeholder="Email" required>
        <button type="button" class="btn btn-custom" onclick="addUser()">Add</button>
    </form>
</div>

<!-- Table -->
<div class="card">
    <h3>Users</h3>
    <table class="table text-white text-center">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="dataTable"></tbody>
    </table>
</div>
```

</div>

<script>
function addUser() {
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;

    if (!name || !email) {
        alert("Please fill all fields");
        return;
    }

    fetch('/add_user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        document.getElementById('insertForm').reset();
        loadUsers();
    })
    .catch(err => console.error(err));
}

function loadUsers() {
    fetch('/users')
    .then(res => res.json())
    .then(data => {
        const table = document.getElementById('dataTable');
        table.innerHTML = '';

        data.forEach(u => {
            table.innerHTML += `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                </tr>`;
        });
    })
    .catch(err => console.error(err));
}

window.onload = loadUsers;
</script>

</body>
